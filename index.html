<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>MinimalFrame</title>
    <meta name="description"
          content="Frame your photos for Instagram with borders, ratios and camera details. Everything stays on your device." />
    <!-- Both themes are designed; this also stops browsers' forced dark mode from repainting the light one. -->
    <meta name="color-scheme" content="light dark only" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161617" />

    <meta property="og:title"       content="MinimalFrame" />
    <meta property="og:description" content="Frame your photos for Instagram with borders, ratios and camera details." />
    <meta property="og:type"        content="website" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
